name: Build Flutter iOS (App Store)

on:
  # push:
  #   branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Select Xcode 26 to get iOS 26 SDK (required for App Store submissions)
      - name: Select Xcode 26
        run: |
          echo "=== Available Xcode versions ==="
          ls /Applications/ | grep Xcode
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          echo "=== Selected Xcode ==="
          xcodebuild -version
      
      # Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      # Install Apple Certificate and Provisioning Profile for signing
      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Define temporary file paths
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode and export secrets to files
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode --output $PP_PATH

          # Create a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -t 3600 -u $KEYCHAIN_PATH

          # Import the certificate into our temporary keychain
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # IMPORTANT: Add keychain to the search list so Xcode can find it
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed s/\"//g)

          # Apply the Provisioning Profile to the system
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # Debug step to verify certificate and profile were installed correctly
      - name: Verify Code Signing Setup
        run: |
          echo "=== Decoded .p12 file size ==="
          ls -la $RUNNER_TEMP/build_certificate.p12

          echo ""
          echo "=== Decoded provisioning profile file size ==="
          ls -la $RUNNER_TEMP/build_pp.mobileprovision

          echo ""
          echo "=== Keychain search list ==="
          security list-keychains -d user

          echo ""
          echo "=== Signing identities found in keychain ==="
          security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db

          echo ""
          echo "=== ALL signing identities (including invalid) ==="
          security find-identity -p codesigning $RUNNER_TEMP/app-signing.keychain-db

          echo ""
          echo "=== Provisioning profile info ==="
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision 2>/dev/null | head -80 || echo "Could not read provisioning profile"
          
      # Inject code signing settings into the Xcode project for CI
      # IMPORTANT: This must happen BEFORE flutter build ios --config-only
      - name: Configure Code Signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
        run: |
          # Add DEVELOPMENT_TEAM, CODE_SIGN_STYLE, PROVISIONING_PROFILE_SPECIFIER, and CODE_SIGN_ENTITLEMENTS
          # to all Runner target build configurations in project.pbxproj
          sed -i '' "s|PRODUCT_BUNDLE_IDENTIFIER = com.eziplug.app;|PRODUCT_BUNDLE_IDENTIFIER = com.eziplug.app; DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}; CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = \"Apple Distribution\"; PROVISIONING_PROFILE_SPECIFIER = \"${APPLE_PROVISIONING_PROFILE_NAME}\"; CODE_SIGN_ENTITLEMENTS = \"Runner/Runner.entitlements\";|g" ios/Runner.xcodeproj/project.pbxproj

          echo "=== Verifying sed replacement worked ==="
          grep -c "DEVELOPMENT_TEAM" ios/Runner.xcodeproj/project.pbxproj || echo "WARNING: DEVELOPMENT_TEAM not found - sed replacement may have failed!"

      # Dynamically generate the ExportOptions.plist on the runner to keep it clean and private
      - name: Generate ExportOptions.plist
        run: |
          cat <<EOF > ios/Runner/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ secrets.APPLE_BUNDLE_ID }}</key>
              <string>${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Get Dependencies and Generate iOS Config
        run: |
          flutter pub get
          flutter build ios --config-only
          
      - name: Configure Push Notification Capabilities & Firebase
        env:
          GOOGLE_SERVICE_INFO_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_BASE64 }}
        run: |
          # 1. Inject the GoogleService-Info.plist from GitHub Secrets
          if [ -z "$GOOGLE_SERVICE_INFO_BASE64" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_BASE64 secret is missing. FirebaseApp.configure() will crash the app on launch."
            exit 1
          fi
          echo -n "$GOOGLE_SERVICE_INFO_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist

          # Fail fast if the secret decoded into something that isn't a valid plist,
          # rather than shipping a build that crashes on every launch.
          if ! plutil -lint ios/Runner/GoogleService-Info.plist; then
            echo "::error::Decoded GoogleService-Info.plist is not a valid plist. Check the base64 secret."
            exit 1
          fi
          echo "✅ Injected GoogleService-Info.plist"

          # 2. Register the plist in the Xcode project's "Copy Bundle Resources"
          #    phase. THIS IS REQUIRED — writing the file to disk is not enough.
          #    Xcode only copies files that are listed in the target's resources
          #    build phase, so without this the plist never reaches the .app and
          #    FirebaseApp.configure() terminates the app at launch.
          cat <<'RUBY' > "$RUNNER_TEMP/add_firebase_plist.rb"
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }
          abort('Runner target not found in Xcode project') if target.nil?

          already_bundled = target.resources_build_phase.files.any? do |build_file|
            build_file.file_ref &&
              build_file.file_ref.path.to_s.end_with?('GoogleService-Info.plist')
          end

          if already_bundled
            puts 'GoogleService-Info.plist is already in Copy Bundle Resources'
          else
            file_ref = project.new_file('Runner/GoogleService-Info.plist')
            target.resources_build_phase.add_file_reference(file_ref, true)
            project.save
            puts 'Added GoogleService-Info.plist to Copy Bundle Resources'
          end
          RUBY

          # xcodeproj ships as a CocoaPods dependency and is present on the
          # macOS runner; install only if that assumption ever stops holding.
          ruby -e "require 'xcodeproj'" 2>/dev/null || sudo gem install xcodeproj --no-document
          ruby "$RUNNER_TEMP/add_firebase_plist.rb"

          # 3. Create the Entitlements file for Push Notifications
          cat <<EOF > ios/Runner/Runner.entitlements
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
          </dict>
          </plist>
          EOF
          echo "✅ Created Runner.entitlements for Push Notifications"
          
          # 4. Ensure remote-notification is in UIBackgroundModes.
          #    Info.plist already declares it, and PlistBuddy's "Add :...:0"
          #    would INSERT a duplicate at index 0 on every run, so check first.
          if /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" ios/Runner/Info.plist 2>/dev/null | grep -q "remote-notification"; then
            echo "✅ remote-notification already present in UIBackgroundModes"
          else
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes: string remote-notification" ios/Runner/Info.plist
            echo "✅ Added remote-notification to UIBackgroundModes"
          fi

          # 5. Prove the plist will actually ship — the whole point of this step.
          echo "=== Runner target Copy Bundle Resources (GoogleService check) ==="
          grep -c "GoogleService-Info.plist" ios/Runner.xcodeproj/project.pbxproj \
            || { echo "::error::GoogleService-Info.plist is still not referenced in the Xcode project."; exit 1; }
        
      # Compile the IPA for distribution
      - name: Build IPA
        run: flutter build ipa --release --export-options-plist=ios/Runner/ExportOptions.plist

      # Verify the shipped binary actually contains the Firebase config and the
      # push entitlement. Without this, a packaging regression only surfaces as
      # a launch crash after the build reaches TestFlight testers.
      - name: Verify Firebase config and push entitlement in IPA
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "Inspecting $IPA"
          WORK=$(mktemp -d)
          unzip -q "$IPA" -d "$WORK"
          APP=$(ls -d "$WORK"/Payload/*.app | head -n 1)

          if [ -f "$APP/GoogleService-Info.plist" ]; then
            echo "✅ GoogleService-Info.plist IS bundled in the .app"
          else
            echo "::error::GoogleService-Info.plist is NOT in the built .app — the app will crash on launch."
            echo "Bundle contents:"; ls "$APP" | head -40
            exit 1
          fi

          echo "=== Signed entitlements ==="
          codesign -d --entitlements :- "$APP" 2>/dev/null | tee "$WORK/ents.txt"
          if grep -q "aps-environment" "$WORK/ents.txt"; then
            echo "✅ aps-environment entitlement present"
          else
            echo "::error::aps-environment missing — push notifications will not work."
            exit 1
          fi

      # Upload the final signed .ipa to GitHub Artifacts (backup)
      - name: Upload Signed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eziplug-release-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 5

      # Upload the IPA to App Store Connect / TestFlight automatically
      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          # Decode the API key from base64
          mkdir -p ~/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          echo "=== Uploading IPA to App Store Connect ==="
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

          echo "✅ Upload complete! Check App Store Connect / TestFlight for the new build."

      # Cleanup sensitive files
      - name: Cleanup
        if: always()
        run: |
          rm -rf ~/private_keys
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f $RUNNER_TEMP/build_certificate.p12
          rm -f $RUNNER_TEMP/build_pp.mobileprovision
